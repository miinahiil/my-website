<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    .gender-group,
    .hobbies-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .students-data {
      margin-top: 30px;
    }

    .student-card {
      background: #f9f9f9;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid #007bff;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      .gender-group,
      .hobbies-group {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Student Registration Form</h1>

    <form id="registrationForm">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" />
        <div class="error" id="nameError"></div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" />
        <div class="error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" />
        <div class="error" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" />
        <div class="error" id="confirmPasswordError"></div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" />
        <div class="error" id="phoneError"></div>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="gender-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <div class="error" id="genderError"></div>
      </div>

      <div class="form-group">
        <label>Course Selection</label>
        <select id="course">
          <option value="">Select Course</option>
          <option value="Web Development">Web Development</option>
          <option value="AI">Artificial Intelligence</option>
          <option value="Cyber Security">Cyber Security</option>
          <option value="Data Science">Data Science</option>
        </select>
        <div class="error" id="courseError"></div>
      </div>

      <div class="form-group">
        <label>Hobbies</label>
        <div class="hobbies-group">
          <label><input type="checkbox" value="Reading"> Reading</label>
          <label><input type="checkbox" value="Sports"> Sports</label>
          <label><input type="checkbox" value="Gaming"> Gaming</label>
          <label><input type="checkbox" value="Traveling"> Traveling</label>
        </div>
        <div class="error" id="hobbiesError"></div>
      </div>

      <div class="form-group">
        <label>Message/About Yourself</label>
        <textarea id="message" rows="4"></textarea>
        <div class="error" id="messageError"></div>
      </div>

      <button type="submit">Register Student</button>

    </form>

    <div class="students-data">
      <h2>Registered Students</h2>
      <div id="studentList"></div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
